<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JustAsking</title>
    <meta name="description" content="Create a question, send the link, get an answer back. No accounts, no server." />
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <div style="max-width:34rem;margin:3rem auto;padding:1.5rem;font:16px/1.5 system-ui,sans-serif">
        <h1 style="font-size:1.25rem;margin:0 0 .5rem">JustAsking needs JavaScript</h1>
        <p style="margin:0;color:#475569">
          The whole card is decoded from the link in your browser, so there is nothing to show
          without JavaScript enabled.
        </p>
      </div>
    </noscript>

    <!--
      Boot diagnostics.

      Deliberately written in ES5 and inlined as a classic script so it parses and
      runs even in a browser that cannot parse the app bundle at all. If the app
      fails to mount, this reports why on the page itself: a blank white screen
      on a phone is otherwise undebuggable, since there is no console to open.
    -->
    <script>
      (function () {
        var shown = false

        function show(title, detail) {
          if (shown) return
          shown = true
          var box = document.createElement('div')
          box.setAttribute('role', 'alert')
          box.style.cssText =
            'max-width:34rem;margin:2rem auto;padding:1.25rem;border:1px solid #e2e8f0;' +
            'border-radius:.75rem;background:#fff;color:#0f172a;' +
            'font:15px/1.5 system-ui,-apple-system,sans-serif'
          var h = document.createElement('h1')
          h.style.cssText = 'font-size:1.1rem;margin:0 0 .5rem'
          h.appendChild(document.createTextNode('JustAsking failed to start'))
          var p = document.createElement('p')
          p.style.cssText = 'margin:0 0 .75rem;color:#475569'
          p.appendChild(document.createTextNode(title))
          var pre = document.createElement('pre')
          pre.style.cssText =
            'margin:0;padding:.75rem;background:#f8fafc;border-radius:.5rem;' +
            'font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word'
          // textContent only -- this string can contain markup from an error message.
          pre.appendChild(document.createTextNode(detail || '(no further detail)'))
          box.appendChild(h)
          box.appendChild(p)
          box.appendChild(pre)
          document.body.appendChild(box)
        }

        // Capture phase so this also sees failed <script>/<link> loads, which do
        // not bubble.
        window.addEventListener(
          'error',
          function (event) {
            if (event && event.target && event.target !== window && event.target.src) {
              show('A file failed to load.', 'Could not load: ' + event.target.src)
              return
            }
            var err = event && event.error
            show(
              'The app hit an error while starting.',
              (err && (err.stack || err.message)) || (event && event.message) || '',
            )
          },
          true,
        )

        window.addEventListener('unhandledrejection', function (event) {
          var r = event && event.reason
          show('A promise rejected while starting.', (r && (r.stack || r.message)) || String(r))
        })

        // Catch-all: nothing rendered and nothing threw that we saw.
        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && root.children.length === 0) {
            show(
              'The page loaded but the app never rendered.',
              'URL: ' + window.location.href + '\nBrowser: ' + navigator.userAgent,
            )
          }
        }, 5000)
      })()
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
