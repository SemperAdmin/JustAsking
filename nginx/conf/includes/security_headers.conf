# Response headers for the cloud.gov deployment.
#
# Pulled in by `location_include: includes/*.conf` in the repo-root Staticfile.
# nginx only evaluates this inside the serving location block, so every rule
# here applies to the site and to nothing else.
#
# `always` is deliberate on each add_header: without it nginx drops the header
# on any response outside 200/201/204/301/302/304, which would leave 404 and 5xx
# pages unprotected.

# The app fetches nothing at runtime. Fonts, styles, script, and the emblem are
# all bundled by Vite and served from this origin, and there is no analytics, no
# telemetry, and no API. A default of 'none' is therefore not aspirational here,
# it is a description, and anything added later has to be declared explicitly.
#
#   script-src   Two inline blocks live in index.html: the pre-paint colour
#                scheme read, and the ES5 boot diagnostic. Both are pinned by
#                hash rather than waved through with 'unsafe-inline'.
#                `npm run verify:deploy` blocks the push if either drifts.
#   style-src    'unsafe-inline' is required and is the one real weakness in
#                this policy. React writes inline style attributes for the
#                per-option animation delays in CardViewer, and CSP treats a
#                style attribute as inline style. Removing it means moving
#                those delays into a stylesheet.
#   img-src      No data: source. vite.config.js sets assetsInlineLimit to 0 so
#                the build emits every asset as a file, which is what lets both
#                img-src and font-src stay at a bare 'self'.
#   connect-src  Explicit 'none' even though default-src already covers it.
#                The claim that this app never phones home is the product's
#                central promise, so it is worth stating in a form a browser
#                enforces and a reviewer can read.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-plrPogskH1HeBGJ8NTbU6WufOskYKruqNuRKINzTGwc=' 'sha256-jrvGGvZJDIqzHfH4pEIFZpHWg6o8ungyIFE8M0la6AU='; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; manifest-src 'none'" always;

# frame-ancestors above is the modern control. This covers browsers reading the
# older header, and costs one line.
add_header X-Frame-Options "DENY" always;

add_header X-Content-Type-Options "nosniff" always;

# The card lives in the URL fragment, and a fragment is never sent in a Referer
# header, so the payload is not at risk here. The path still identifies the app,
# and the outbound feedback link goes to a third party, so send nothing.
add_header Referrer-Policy "no-referrer" always;

# The app reads no device sensor and asks for no permission. Deny the set
# outright rather than leaving it to browser defaults.
add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Deliberately no per-path cache rule here.
#
# Vite fingerprints every asset filename, so a year-long immutable cache on
# /assets/ would be correct and worth having. The way to express it in this file
# is a nested location block, and nginx does not inherit add_header into a child
# that declares its own: every security header above would vanish from exactly
# the responses carrying the application code. Buying a cache hint at the cost
# of the policy is a bad trade. Asset caching belongs in front of the app, on
# CloudFront or the platform CDN, where it does not compete with these headers.
