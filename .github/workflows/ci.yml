name: CI

# Runs on every pull request and on every push to a branch other than main.
# Pushes to main are covered by the gate inside the deploy workflow, so running
# both here would duplicate the work on the one branch it matters most on.

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
